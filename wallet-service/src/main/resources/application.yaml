server:
  port: 8081

spring:
  application:
    name: wallet-service


  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  config:
    import: optional:file:.env[.properties]

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      format-sql: true,

    flayway:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}